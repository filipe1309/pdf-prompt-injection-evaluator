<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Injection Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header data-tauri-drag-region>
            <div class="header-brand" data-tauri-drag-region>
                <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M9 12h6"/><path d="M12 9v6"/></svg>
                <h1 id="app-title">PDF Injection Checker</h1>
            </div>
            <div id="header-actions" class="hidden">
                <button id="back-to-queue-btn" class="header-btn hidden" data-tooltip-key="back_to_queue">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    <span class="btn-label" data-i18n="btn_queue">Queue</span>
                </button>
                <button id="deep-analysis-btn" class="header-btn header-btn-primary" data-tooltip-key="deep_analysis">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
                    <span class="btn-label" data-i18n="btn_analyze">Analyze</span>
                </button>
                <button id="export-btn" class="header-btn" data-tooltip-key="export_report">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                    <span class="btn-label" data-i18n="btn_export">Export</span>
                </button>
                <span class="header-divider"></span>
                <button id="new-file-btn" class="header-btn" data-tooltip-key="new_file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span class="btn-label" data-i18n="btn_new">New</span>
                </button>
            </div>
            <div class="header-utils">
                <button id="settings-btn" class="header-btn" data-tooltip-key="settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="info-btn" class="header-btn" data-tooltip-key="info_title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </button>
            </div>
        </header>

        <!-- Drop Zone (initial state) -->
        <main id="drop-zone-container">
            <div class="drop-zone-bg-effects">
                <div class="bg-orb bg-orb-1"></div>
                <div class="bg-orb bg-orb-2"></div>
                <div class="bg-orb bg-orb-3"></div>
            </div>
            <div id="drop-zone">
                <div class="drop-icon">
                    <div class="drop-icon-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                        <svg class="drop-shield-badge" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                    </div>
                </div>
                <p id="drop-text-primary">Arraste um PDF aqui ou clique para selecionar</p>
                <p id="drop-text-secondary">Drop a PDF here or click to browse</p>
                <p id="drop-text-hint" class="drop-hint">PDF · max 50MB</p>
            </div>
        </main>

        <!-- Analysis View (after file loaded) -->
        <main id="analysis-view" class="hidden">
            <div id="pdf-panel">
                <div id="pdf-nav-controls">
                    <button id="pdf-prev-btn" class="pdf-nav-btn" title="Previous page">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <span id="pdf-page-indicator">1 / 1</span>
                    <button id="pdf-next-btn" class="pdf-nav-btn" title="Next page">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
                <canvas id="pdf-canvas"></canvas>
            </div>
            <div id="panel-divider"></div>
            <div id="results-panel">
                <div id="verdict-banner"></div>
                <div id="file-info-bar" class="hidden"></div>
                <div id="findings-summary-bar" class="hidden"></div>
                <div id="findings-list"></div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="settings-title">Settings</h2>
                <label for="provider-select" id="provider-label">LLM Provider</label>
                <select id="provider-select">
                    <option value="OpenAI">OpenAI</option>
                    <option value="Gemini">Google Gemini</option>
                    <option value="Anthropic">Anthropic</option>
                    <option value="Custom">Custom Endpoint</option>
                </select>
                <label for="api-key-input" id="apikey-label">API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
                <label for="custom-endpoint" id="endpoint-label" class="hidden">Custom Endpoint URL</label>
                <input type="url" id="custom-endpoint" class="hidden" placeholder="https://...">
                <label for="language-select" id="language-label">Language</label>
                <select id="language-select">
                    <option value="pt-BR">Português (BR)</option>
                    <option value="en">English</option>
                </select>
                <div class="modal-actions">
                    <button id="save-settings-btn" class="btn btn-primary">Save</button>
                    <button id="cancel-settings-btn" class="btn btn-ghost">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Info Modal -->
        <div id="info-modal" class="modal hidden">
            <div class="modal-content modal-content-wide">
                <div class="info-header">
                    <h2 id="info-title">Tipos de Injeção em PDF</h2>
                    <button id="close-info-btn" class="header-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div id="info-list" class="info-list"></div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Analyzing...</p>
        </div>
        <footer class="app-footer"><span id="app-version"></span> · Made with ❤️ by <a href="https://github.com/filipe1309" target="_blank">@filipe1309</a></footer>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
