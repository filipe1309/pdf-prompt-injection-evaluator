<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Injection Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="app-title">PDF Injection Checker</h1>
            <div id="header-actions" class="hidden">
                <button id="deep-analysis-btn" class="header-btn" title="Deep Analysis">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
                </button>
                <button id="export-btn" class="header-btn" title="Export Report">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                </button>
                <button id="new-file-btn" class="header-btn" title="New File">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
            </div>
            <button id="settings-btn" class="header-btn" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </header>

        <!-- Drop Zone (initial state) -->
        <main id="drop-zone-container">
            <div id="drop-zone">
                <div class="drop-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                </div>
                <p id="drop-text-primary">Arraste um PDF aqui ou clique para selecionar</p>
                <p id="drop-text-secondary">Drop a PDF here or click to browse</p>
            </div>
        </main>

        <!-- Analysis View (after file loaded) -->
        <main id="analysis-view" class="hidden">
            <div id="pdf-panel">
                <canvas id="pdf-canvas"></canvas>
            </div>
            <div id="results-panel">
                <div id="verdict-banner"></div>
                <div id="findings-list"></div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="settings-title">Settings</h2>
                <label for="provider-select" id="provider-label">LLM Provider</label>
                <select id="provider-select">
                    <option value="OpenAI">OpenAI</option>
                    <option value="Gemini">Google Gemini</option>
                    <option value="Anthropic">Anthropic</option>
                    <option value="Custom">Custom Endpoint</option>
                </select>
                <label for="api-key-input" id="apikey-label">API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
                <label for="custom-endpoint" id="endpoint-label" class="hidden">Custom Endpoint URL</label>
                <input type="url" id="custom-endpoint" class="hidden" placeholder="https://...">
                <label for="language-select" id="language-label">Language</label>
                <select id="language-select">
                    <option value="pt-BR">Português (BR)</option>
                    <option value="en">English</option>
                </select>
                <div class="modal-actions">
                    <button id="save-settings-btn" class="btn btn-primary">Save</button>
                    <button id="cancel-settings-btn" class="btn btn-ghost">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Analyzing...</p>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
